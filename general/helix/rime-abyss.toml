pink = "#d4aaff"
yellow = "#9cf0dc"
green = "#6fd0a8"
cyan = "#4fb4dc"
blue = "#6b9cf4"
violet = "#937ff2"
steel = "#7182a8"
bg_dark = "#111317"
border = "#252830"
colorcolumn = "#191c21"
whitespace = "#444b5a"
diff_add = "#233331"
diff_change = "#1f2736"
diff_text = "#2f3f5d"
diff_delete = "#352830"
search = "#3b5452"
diag_error = "#2a2229"
diag_warn = "#232d2f"
diag_info = "#1e2432"
diag_hint = "#1b272f"
diag_ok = "#1e2a2a"
