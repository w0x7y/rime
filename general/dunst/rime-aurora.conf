# Rime Aurora: Vivid neon accents on a darker background.
# https://github.com/w0x7y/rime
[global]
    separator_color = "frame"
    highlight = "#4fa2ff"

[urgency_low]
    background = "#24282f"
    foreground = "#9aa4b6"
    frame_color = "#333842"

[urgency_normal]
    background = "#24282f"
    foreground = "#c8d2e2"
    frame_color = "#4fa2ff"

[urgency_critical]
    background = "#24282f"
    foreground = "#c8d2e2"
    frame_color = "#ff6f91"
    highlight = "#ff6f91"
