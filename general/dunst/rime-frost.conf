# Rime Frost: Frost-white paper under the same cold accents, deepened to read on it.
# https://github.com/w0x7y/rime
[global]
    separator_color = "frame"
    highlight = "#2e62c0"

[urgency_low]
    background = "#e3e7ee"
    foreground = "#566073"
    frame_color = "#d2d8e2"

[urgency_normal]
    background = "#e3e7ee"
    foreground = "#363d4a"
    frame_color = "#2e62c0"

[urgency_critical]
    background = "#e3e7ee"
    foreground = "#363d4a"
    frame_color = "#b83d63"
    highlight = "#b83d63"
