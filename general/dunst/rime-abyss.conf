# Rime Abyss: The coldest take, on a darker background: no yellow or orange anywhere, with rose as the only warm accent.
# https://github.com/w0x7y/rime
[global]
    separator_color = "frame"
    highlight = "#6b9cf4"

[urgency_low]
    background = "#1d2026"
    foreground = "#9aa4b6"
    frame_color = "#2c3039"

[urgency_normal]
    background = "#1d2026"
    foreground = "#c2cde0"
    frame_color = "#6b9cf4"

[urgency_critical]
    background = "#1d2026"
    foreground = "#c2cde0"
    frame_color = "#e8879f"
    highlight = "#e8879f"
