# Rime Glacier: Crisper accents with clear separation between every syntax role, on a lighter background.
# https://github.com/w0x7y/rime
[global]
    separator_color = "frame"
    highlight = "#6eaaf0"

[urgency_low]
    background = "#323841"
    foreground = "#9aa4b6"
    frame_color = "#414854"

[urgency_normal]
    background = "#323841"
    foreground = "#c5cedd"
    frame_color = "#6eaaf0"

[urgency_critical]
    background = "#323841"
    foreground = "#c5cedd"
    frame_color = "#e07a90"
    highlight = "#e07a90"
