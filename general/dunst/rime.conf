# Rime: Soft and muted pastels for long sessions.
# https://github.com/w0x7y/rime
[global]
    separator_color = "frame"
    highlight = "#7aa4e4"

[urgency_low]
    background = "#2b3038"
    foreground = "#9aa4b6"
    frame_color = "#3a404b"

[urgency_normal]
    background = "#2b3038"
    foreground = "#c3ccd9"
    frame_color = "#7aa4e4"

[urgency_critical]
    background = "#2b3038"
    foreground = "#c3ccd9"
    frame_color = "#d98a9c"
    highlight = "#d98a9c"
