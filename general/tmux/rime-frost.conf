# Rime Frost: Frost-white paper under the same cold accents, deepened to read on it.
# https://github.com/w0x7y/rime

set -g status-style "fg=#566073,bg=#f7f8fa"
set -g window-status-style "fg=#7f899b"
set -g window-status-current-style "fg=#272d37,bg=#eef1f5"
set -g window-status-activity-style "fg=#866405"
set -g window-status-bell-style "fg=#b83d63"
set -g pane-border-style "fg=#d2d8e2"
set -g pane-active-border-style "fg=#2e62c0"
set -g message-style "fg=#363d4a,bg=#e3e7ee"
set -g message-command-style "fg=#363d4a,bg=#e3e7ee"
set -g mode-style "fg=#272d37,bg=#d2d8e2"
set -g copy-mode-match-style "fg=#eef1f5,bg=#866405"
set -g copy-mode-current-match-style "fg=#eef1f5,bg=#2e62c0"
set -g clock-mode-colour "#2e62c0"
set -g display-panes-colour "#7f899b"
set -g display-panes-active-colour "#2e62c0"
# -q: popups arrived in tmux 3.3, so 3.2 skips this line instead of failing
set -gq popup-border-style "fg=#dbe0e8"
