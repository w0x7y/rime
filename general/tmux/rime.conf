# Rime: Soft and muted pastels for long sessions.
# https://github.com/w0x7y/rime

set -g status-style "fg=#9aa4b6,bg=#1d2026"
set -g window-status-style "fg=#6b768c"
set -g window-status-current-style "fg=#dce2eb,bg=#23272e"
set -g window-status-activity-style "fg=#e4d098"
set -g window-status-bell-style "fg=#d98a9c"
set -g pane-border-style "fg=#3a404b"
set -g pane-active-border-style "fg=#7aa4e4"
set -g message-style "fg=#c3ccd9,bg=#2b3038"
set -g message-command-style "fg=#c3ccd9,bg=#2b3038"
set -g mode-style "fg=#dce2eb,bg=#3a404b"
set -g copy-mode-match-style "fg=#23272e,bg=#e4d098"
set -g copy-mode-current-match-style "fg=#23272e,bg=#7aa4e4"
set -g clock-mode-colour "#7aa4e4"
set -g display-panes-colour "#6b768c"
set -g display-panes-active-colour "#7aa4e4"
# -q: popups arrived in tmux 3.3, so 3.2 skips this line instead of failing
set -gq popup-border-style "fg=#333842"
