# Rime Aurora: Vivid neon accents on a darker background.
# https://github.com/w0x7y/rime

set -g status-style "fg=#9aa4b6,bg=#17191e"
set -g window-status-style "fg=#6b768c"
set -g window-status-current-style "fg=#e0e7f2,bg=#1c1f25"
set -g window-status-activity-style "fg=#e6f07c"
set -g window-status-bell-style "fg=#ff6f91"
set -g pane-border-style "fg=#333842"
set -g pane-active-border-style "fg=#4fa2ff"
set -g message-style "fg=#c8d2e2,bg=#24282f"
set -g message-command-style "fg=#c8d2e2,bg=#24282f"
set -g mode-style "fg=#e0e7f2,bg=#333842"
set -g copy-mode-match-style "fg=#1c1f25,bg=#e6f07c"
set -g copy-mode-current-match-style "fg=#1c1f25,bg=#4fa2ff"
set -g clock-mode-colour "#4fa2ff"
set -g display-panes-colour "#6b768c"
set -g display-panes-active-colour "#4fa2ff"
# -q: popups arrived in tmux 3.3, so 3.2 skips this line instead of failing
set -gq popup-border-style "fg=#2c3039"
