# Rime Abyss: The coldest take, on a darker background: no yellow or orange anywhere, with rose as the only warm accent.
# https://github.com/w0x7y/rime

set -g status-style "fg=#9aa4b6,bg=#111317"
set -g window-status-style "fg=#6b768c"
set -g window-status-current-style "fg=#dde5f2,bg=#15171c"
set -g window-status-activity-style "fg=#9cf0dc"
set -g window-status-bell-style "fg=#e8879f"
set -g pane-border-style "fg=#2c3039"
set -g pane-active-border-style "fg=#6b9cf4"
set -g message-style "fg=#c2cde0,bg=#1d2026"
set -g message-command-style "fg=#c2cde0,bg=#1d2026"
set -g mode-style "fg=#dde5f2,bg=#2c3039"
set -g copy-mode-match-style "fg=#15171c,bg=#9cf0dc"
set -g copy-mode-current-match-style "fg=#15171c,bg=#6b9cf4"
set -g clock-mode-colour "#6b9cf4"
set -g display-panes-colour "#6b768c"
set -g display-panes-active-colour "#6b9cf4"
# -q: popups arrived in tmux 3.3, so 3.2 skips this line instead of failing
set -gq popup-border-style "fg=#252830"
