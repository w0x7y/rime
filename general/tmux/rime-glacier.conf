# Rime Glacier: Crisper accents with clear separation between every syntax role, on a lighter background.
# https://github.com/w0x7y/rime

set -g status-style "fg=#9aa4b6,bg=#22272d"
set -g window-status-style "fg=#737e94"
set -g window-status-current-style "fg=#dfe5ee,bg=#2a2f37"
set -g window-status-activity-style "fg=#e3dc9e"
set -g window-status-bell-style "fg=#e07a90"
set -g pane-border-style "fg=#414854"
set -g pane-active-border-style "fg=#6eaaf0"
set -g message-style "fg=#c5cedd,bg=#323841"
set -g message-command-style "fg=#c5cedd,bg=#323841"
set -g mode-style "fg=#dfe5ee,bg=#414854"
set -g copy-mode-match-style "fg=#2a2f37,bg=#e3dc9e"
set -g copy-mode-current-match-style "fg=#2a2f37,bg=#6eaaf0"
set -g clock-mode-colour "#6eaaf0"
set -g display-panes-colour "#737e94"
set -g display-panes-active-colour "#6eaaf0"
# -q: popups arrived in tmux 3.3, so 3.2 skips this line instead of failing
set -gq popup-border-style "fg=#3a404b"
