# Rime: Soft and muted pastels for long sessions.
# https://github.com/w0x7y/rime

[mgr]
cwd = { fg = "#7cc4d0" }
find_keyword = { fg = "#e4d098", bold = true, italic = true, underline = true }
find_position = { fg = "#bb98d6", bold = true, italic = true }
marker_copied = { fg = "#9ad8ac", bg = "#9ad8ac" }
marker_cut = { fg = "#d98a9c", bg = "#d98a9c" }
marker_marked = { fg = "#7cc4d0", bg = "#7cc4d0" }
marker_selected = { fg = "#e4d098", bg = "#e4d098" }
count_copied = { fg = "#23272e", bg = "#9ad8ac" }
count_cut = { fg = "#23272e", bg = "#d98a9c" }
count_selected = { fg = "#23272e", bg = "#e4d098" }
border_style = { fg = "#3a404b" }

[tabs]
active = { fg = "#23272e", bg = "#7aa4e4", bold = true }
inactive = { fg = "#7aa4e4", bg = "#3a404b" }

[mode]
normal_main = { fg = "#23272e", bg = "#7aa4e4", bold = true }
normal_alt = { fg = "#7aa4e4", bg = "#3a404b" }
select_main = { fg = "#23272e", bg = "#bb98d6", bold = true }
select_alt = { fg = "#bb98d6", bg = "#3a404b" }
unset_main = { fg = "#23272e", bg = "#d98a9c", bold = true }
unset_alt = { fg = "#d98a9c", bg = "#3a404b" }

[indicator]
parent = { bg = "#2b3038" }
current = { bg = "#3a404b" }
preview = { underline = true }

[status]
perm_sep = { fg = "#6b768c" }
perm_type = { fg = "#9ad8ac" }
perm_read = { fg = "#e4d098" }
perm_write = { fg = "#d98a9c" }
perm_exec = { fg = "#7cc4d0" }
progress_label = { fg = "#dce2eb", bold = true }
progress_normal = { fg = "#7aa4e4", bg = "#3a404b" }
progress_error = { fg = "#d98a9c", bg = "#3a404b" }

[which]
border = { fg = "#7aa4e4" }
mask = { bg = "#2b3038" }
cand = { fg = "#7cc4d0" }
rest = { fg = "#6b768c" }
desc = { fg = "#bb98d6" }
separator_style = { fg = "#6b768c" }

[confirm]
border = { fg = "#7aa4e4" }
title = { fg = "#7aa4e4" }
btn_yes = { fg = "#23272e", bg = "#7aa4e4" }

[spot]
border = { fg = "#7aa4e4" }
title = { fg = "#7aa4e4" }
tbl_col = { fg = "#7aa4e4" }
tbl_cell = { fg = "#dce2eb", bg = "#3a404b" }

[notify]
title_info = { fg = "#9ad8ac" }
title_warn = { fg = "#e4d098" }
title_error = { fg = "#d98a9c" }

[pick]
border = { fg = "#7aa4e4" }
active = { fg = "#bb98d6", bold = true }

[input]
border = { fg = "#7aa4e4" }
selected = { bg = "#3a404b" }

[cmp]
border = { fg = "#7aa4e4" }
active = { bg = "#3a404b" }

[tasks]
border = { fg = "#7aa4e4" }
hovered = { fg = "#bb98d6", bold = true }

[help]
border = { fg = "#7aa4e4" }
chord = { fg = "#7cc4d0" }
hovered = { bg = "#3a404b", bold = true }

[filetype]
rules = [
	{ mime = "**/{image,audio,video}/*", fg = "#e8a8cc" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d98a9c", bold = true },
	{ mime = "vfs/{absent,stale}", fg = "#6b768c" },
	{ url = "*", is = "orphan", fg = "#d98a9c" },
	{ url = "*", is = "exec", fg = "#9ad8ac", bold = true },
	{ url = "*", is = "dummy", fg = "#d98a9c" },
	{ url = "*/", is = "dummy", fg = "#d98a9c" },
	{ url = "*/", fg = "#7aa4e4" },
]
