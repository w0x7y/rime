# Rime Aurora: Vivid neon accents on a darker background.
# https://github.com/w0x7y/rime

[mgr]
cwd = { fg = "#38dce8" }
find_keyword = { fg = "#e6f07c", bold = true, italic = true, underline = true }
find_position = { fg = "#9b7dff", bold = true, italic = true }
marker_copied = { fg = "#5ef0a6", bg = "#5ef0a6" }
marker_cut = { fg = "#ff6f91", bg = "#ff6f91" }
marker_marked = { fg = "#38dce8", bg = "#38dce8" }
marker_selected = { fg = "#e6f07c", bg = "#e6f07c" }
count_copied = { fg = "#1c1f25", bg = "#5ef0a6" }
count_cut = { fg = "#1c1f25", bg = "#ff6f91" }
count_selected = { fg = "#1c1f25", bg = "#e6f07c" }
border_style = { fg = "#333842" }

[tabs]
active = { fg = "#1c1f25", bg = "#4fa2ff", bold = true }
inactive = { fg = "#4fa2ff", bg = "#333842" }

[mode]
normal_main = { fg = "#1c1f25", bg = "#4fa2ff", bold = true }
normal_alt = { fg = "#4fa2ff", bg = "#333842" }
select_main = { fg = "#1c1f25", bg = "#9b7dff", bold = true }
select_alt = { fg = "#9b7dff", bg = "#333842" }
unset_main = { fg = "#1c1f25", bg = "#ff6f91", bold = true }
unset_alt = { fg = "#ff6f91", bg = "#333842" }

[indicator]
parent = { bg = "#24282f" }
current = { bg = "#333842" }
preview = { underline = true }

[status]
perm_sep = { fg = "#6b768c" }
perm_type = { fg = "#5ef0a6" }
perm_read = { fg = "#e6f07c" }
perm_write = { fg = "#ff6f91" }
perm_exec = { fg = "#38dce8" }
progress_label = { fg = "#e0e7f2", bold = true }
progress_normal = { fg = "#4fa2ff", bg = "#333842" }
progress_error = { fg = "#ff6f91", bg = "#333842" }

[which]
border = { fg = "#4fa2ff" }
mask = { bg = "#24282f" }
cand = { fg = "#38dce8" }
rest = { fg = "#6b768c" }
desc = { fg = "#9b7dff" }
separator_style = { fg = "#6b768c" }

[confirm]
border = { fg = "#4fa2ff" }
title = { fg = "#4fa2ff" }
btn_yes = { fg = "#1c1f25", bg = "#4fa2ff" }

[spot]
border = { fg = "#4fa2ff" }
title = { fg = "#4fa2ff" }
tbl_col = { fg = "#4fa2ff" }
tbl_cell = { fg = "#e0e7f2", bg = "#333842" }

[notify]
title_info = { fg = "#5ef0a6" }
title_warn = { fg = "#e6f07c" }
title_error = { fg = "#ff6f91" }

[pick]
border = { fg = "#4fa2ff" }
active = { fg = "#9b7dff", bold = true }

[input]
border = { fg = "#4fa2ff" }
selected = { bg = "#333842" }

[cmp]
border = { fg = "#4fa2ff" }
active = { bg = "#333842" }

[tasks]
border = { fg = "#4fa2ff" }
hovered = { fg = "#9b7dff", bold = true }

[help]
border = { fg = "#4fa2ff" }
chord = { fg = "#38dce8" }
hovered = { bg = "#333842", bold = true }

[filetype]
rules = [
	{ mime = "**/{image,audio,video}/*", fg = "#ff8fe0" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff6f91", bold = true },
	{ mime = "vfs/{absent,stale}", fg = "#6b768c" },
	{ url = "*", is = "orphan", fg = "#ff6f91" },
	{ url = "*", is = "exec", fg = "#5ef0a6", bold = true },
	{ url = "*", is = "dummy", fg = "#ff6f91" },
	{ url = "*/", is = "dummy", fg = "#ff6f91" },
	{ url = "*/", fg = "#4fa2ff" },
]
