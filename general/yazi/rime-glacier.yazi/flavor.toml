# Rime Glacier: Crisper accents with clear separation between every syntax role, on a lighter background.
# https://github.com/w0x7y/rime

[mgr]
cwd = { fg = "#6fd0d8" }
find_keyword = { fg = "#e3dc9e", bold = true, italic = true, underline = true }
find_position = { fg = "#ae94f0", bold = true, italic = true }
marker_copied = { fg = "#88d8a0", bg = "#88d8a0" }
marker_cut = { fg = "#e07a90", bg = "#e07a90" }
marker_marked = { fg = "#6fd0d8", bg = "#6fd0d8" }
marker_selected = { fg = "#e3dc9e", bg = "#e3dc9e" }
count_copied = { fg = "#2a2f37", bg = "#88d8a0" }
count_cut = { fg = "#2a2f37", bg = "#e07a90" }
count_selected = { fg = "#2a2f37", bg = "#e3dc9e" }
border_style = { fg = "#414854" }

[tabs]
active = { fg = "#2a2f37", bg = "#6eaaf0", bold = true }
inactive = { fg = "#6eaaf0", bg = "#414854" }

[mode]
normal_main = { fg = "#2a2f37", bg = "#6eaaf0", bold = true }
normal_alt = { fg = "#6eaaf0", bg = "#414854" }
select_main = { fg = "#2a2f37", bg = "#ae94f0", bold = true }
select_alt = { fg = "#ae94f0", bg = "#414854" }
unset_main = { fg = "#2a2f37", bg = "#e07a90", bold = true }
unset_alt = { fg = "#e07a90", bg = "#414854" }

[indicator]
parent = { bg = "#323841" }
current = { bg = "#414854" }
preview = { underline = true }

[status]
perm_sep = { fg = "#737e94" }
perm_type = { fg = "#88d8a0" }
perm_read = { fg = "#e3dc9e" }
perm_write = { fg = "#e07a90" }
perm_exec = { fg = "#6fd0d8" }
progress_label = { fg = "#dfe5ee", bold = true }
progress_normal = { fg = "#6eaaf0", bg = "#414854" }
progress_error = { fg = "#e07a90", bg = "#414854" }

[which]
border = { fg = "#6eaaf0" }
mask = { bg = "#323841" }
cand = { fg = "#6fd0d8" }
rest = { fg = "#737e94" }
desc = { fg = "#ae94f0" }
separator_style = { fg = "#737e94" }

[confirm]
border = { fg = "#6eaaf0" }
title = { fg = "#6eaaf0" }
btn_yes = { fg = "#2a2f37", bg = "#6eaaf0" }

[spot]
border = { fg = "#6eaaf0" }
title = { fg = "#6eaaf0" }
tbl_col = { fg = "#6eaaf0" }
tbl_cell = { fg = "#dfe5ee", bg = "#414854" }

[notify]
title_info = { fg = "#88d8a0" }
title_warn = { fg = "#e3dc9e" }
title_error = { fg = "#e07a90" }

[pick]
border = { fg = "#6eaaf0" }
active = { fg = "#ae94f0", bold = true }

[input]
border = { fg = "#6eaaf0" }
selected = { bg = "#414854" }

[cmp]
border = { fg = "#6eaaf0" }
active = { bg = "#414854" }

[tasks]
border = { fg = "#6eaaf0" }
hovered = { fg = "#ae94f0", bold = true }

[help]
border = { fg = "#6eaaf0" }
chord = { fg = "#6fd0d8" }
hovered = { bg = "#414854", bold = true }

[filetype]
rules = [
	{ mime = "**/{image,audio,video}/*", fg = "#f2a7e0" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e07a90", bold = true },
	{ mime = "vfs/{absent,stale}", fg = "#737e94" },
	{ url = "*", is = "orphan", fg = "#e07a90" },
	{ url = "*", is = "exec", fg = "#88d8a0", bold = true },
	{ url = "*", is = "dummy", fg = "#e07a90" },
	{ url = "*/", is = "dummy", fg = "#e07a90" },
	{ url = "*/", fg = "#6eaaf0" },
]
