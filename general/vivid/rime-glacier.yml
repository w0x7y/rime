# Rime Glacier: Crisper accents with clear separation between every syntax role, on a lighter background.
# https://github.com/w0x7y/rime
colors:
  blue: '6eaaf0'
  cyan: '6fd0d8'
  yellow: 'e3dc9e'
  violet: 'ae94f0'
  red: 'e07a90'
  bg: '2a2f37'
  green: '88d8a0'
  diag_ok: '334042'
  muted: '9aa4b6'
  fg: 'c5cedd'
  pink: 'f2a7e0'
  comment: '737e94'

core:
  normal_text: {}
  regular_file: {}
  reset_to_normal: {}
  multi_hard_link: {}
  file_with_capability: {}
  directory:
    foreground: blue
  symlink:
    foreground: cyan
  fifo:
    foreground: yellow
  socket:
    foreground: violet
  door:
    foreground: violet
  block_device:
    foreground: yellow
    font-style: bold
  character_device:
    foreground: yellow
    font-style: bold
  broken_symlink:
    foreground: red
  missing_symlink_target:
    foreground: red
  setuid:
    foreground: bg
    background: red
  setgid:
    foreground: bg
    background: yellow
  sticky_other_writable:
    foreground: bg
    background: green
  other_writable:
    foreground: blue
    background: diag_ok
  sticky:
    foreground: bg
    background: blue
  executable_file:
    foreground: green
    font-style: bold
text:
  special:
    foreground: yellow
    font-style: bold
  todo:
    foreground: yellow
    font-style: bold
  licenses:
    foreground: muted
  configuration:
    foreground: yellow
  other:
    foreground: fg
markup:
  foreground: fg
programming:
  source:
    foreground: violet
  tooling:
    foreground: yellow
media:
  foreground: pink
office:
  foreground: fg
archives:
  foreground: red
  font-style: bold
executable:
  foreground: green
  font-style: bold
unimportant:
  foreground: comment
