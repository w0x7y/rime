# Rime Abyss: The coldest take, on a darker background: no yellow or orange anywhere, with rose as the only warm accent.
# https://github.com/w0x7y/rime
colors:
  blue: '6b9cf4'
  cyan: '4fb4dc'
  yellow: '9cf0dc'
  violet: '937ff2'
  red: 'e8879f'
  bg: '15171c'
  green: '6fd0a8'
  diag_ok: '1e2a2a'
  muted: '9aa4b6'
  fg: 'c2cde0'
  pink: 'd4aaff'
  comment: '6b768c'

core:
  normal_text: {}
  regular_file: {}
  reset_to_normal: {}
  multi_hard_link: {}
  file_with_capability: {}
  directory:
    foreground: blue
  symlink:
    foreground: cyan
  fifo:
    foreground: yellow
  socket:
    foreground: violet
  door:
    foreground: violet
  block_device:
    foreground: yellow
    font-style: bold
  character_device:
    foreground: yellow
    font-style: bold
  broken_symlink:
    foreground: red
  missing_symlink_target:
    foreground: red
  setuid:
    foreground: bg
    background: red
  setgid:
    foreground: bg
    background: yellow
  sticky_other_writable:
    foreground: bg
    background: green
  other_writable:
