# Rime: Soft and muted pastels for long sessions.
# https://github.com/w0x7y/rime
colors:
  blue: '7aa4e4'
  cyan: '7cc4d0'
  yellow: 'e4d098'
  violet: 'bb98d6'
  red: 'd98a9c'
  bg: '23272e'
  green: '9ad8ac'
  diag_ok: '2f393b'
  muted: '9aa4b6'
  fg: 'c3ccd9'
  pink: 'e8a8cc'
  comment: '6b768c'

core:
  normal_text: {}
  regular_file: {}
  reset_to_normal: {}
  multi_hard_link: {}
  file_with_capability: {}
  directory:
    foreground: blue
  symlink:
    foreground: cyan
  fifo:
    foreground: yellow
  socket:
    foreground: violet
  door:
    foreground: violet
  block_device:
    foreground: yellow
    font-style: bold
  character_device:
    foreground: yellow
    font-style: bold
  broken_symlink:
    foreground: red
  missing_symlink_target:
    foreground: red
  setuid:
    foreground: bg
    background: red
  setgid:
    foreground: bg
    background: yellow
  sticky_other_writable:
    foreground: bg
    background: green
  other_writable:
    foreground: blue
    background: diag_ok
  sticky:
    foreground: bg
    background: blue
  executable_file:
    foreground: green
    font-style: bold
text:
  special:
    foreground: yellow
    font-style: bold
  todo:
    foreground: yellow
    font-style: bold
  licenses:
    foreground: muted
  configuration:
    foreground: yellow
  other:
    foreground: fg
markup:
  foreground: fg
programming:
  source:
    foreground: violet
  tooling:
    foreground: yellow
media:
  foreground: pink
office:
  foreground: fg
archives:
  foreground: red
  font-style: bold
executable:
  foreground: green
  font-style: bold
unimportant:
  foreground: comment
