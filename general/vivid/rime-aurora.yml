# Rime Aurora: Vivid neon accents on a darker background.
# https://github.com/w0x7y/rime
colors:
  blue: '4fa2ff'
  cyan: '38dce8'
  yellow: 'e6f07c'
  violet: '9b7dff'
  red: 'ff6f91'
  bg: '1c1f25'
  green: '5ef0a6'
  diag_ok: '233432'
  muted: '9aa4b6'
  fg: 'c8d2e2'
  pink: 'ff8fe0'
  comment: '6b768c'

core:
